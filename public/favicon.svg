      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#qg)"/>
  <!-- Q 圆环 -->
  <circle cx="29" cy="28" r="14" fill="none" stroke="#ffffff" stroke-width="5.5"/>
